[package]
name = "turso-sync-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.11.1"
clap = { version = "4.5.47", features = ["derive", "env"] }
crc32c = "0.6.8"
mimalloc = { version = "0.1.47", default-features = false }
prost = "0.14.1"
roaring = "0.11.2"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
# Internal APIs of these crates change between releases, so they are pinned exactly.
turso_core = { version = "=0.8.3", features = ["conn_raw_api"] }
turso_sync_engine = "=0.8.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
# A panic while a database mutex is held poisons it for good; crash and let the
# supervisor restart the process instead.
panic = "abort"
